# Render Blueprint: one web service (API + built frontend) and a managed PostgreSQL database.
# Deploy: push this repository to GitHub, then in Render choose New + > Blueprint and select the repo.
databases:
  - name: vista-db
    plan: free
    databaseName: vista
    user: vista

services:
  - type: web
    name: vista
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vista-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://vista.onrender.com   # change to your Render URL
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DB_POOL_SIZE
        value: "5"        # free Render Postgres allows few connections
      - key: DB_MAX_OVERFLOW
        value: "2"
